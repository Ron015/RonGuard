
name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      HAS_KEY: ${{ secrets.WARDEN_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check signing configuration
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::WARDEN_KEYSTORE_BASE64 secret is missing."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        run: ./gradlew detekt testDebugUnitTest

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WARDEN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/warden.jks"

      - name: Build signed release APKs
        env:
          WARDEN_KEYSTORE: ${{ runner.temp }}/warden.jks
          WARDEN_KEYSTORE_PASSWORD: ${{ secrets.WARDEN_KEYSTORE_PASSWORD }}
          WARDEN_KEY_ALIAS: ${{ secrets.WARDEN_KEY_ALIAS }}
          WARDEN_KEY_PASSWORD: ${{ secrets.WARDEN_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

          for abi in arm64-v8a armeabi-v7a universal; do
            mv "app/build/outputs/apk/release/app-${abi}-release.apk" \
              "warden-${GITHUB_RUN_NUMBER}-${abi}.apk"
          done

          sha256sum warden-*.apk > SHA256SUMS.txt

      - name: Generate automatic version tag
        id: tag
        run: |
          VERSION="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Warden ${{ steps.tag.outputs.version }}
          files: |
            warden-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ steps.tag.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed APKs uploaded successfully." >> "$GITHUB_STEP_SUMMARY"
